name: Build Andro AI Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Detect and build Android project
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository and build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          test -f package.json || { echo "::error::package.json not found at repository root. Check the workflow repository and working-directory."; exit 1; }
          test -f capacitor.config.json -o -f capacitor.config.ts -o -f capacitor.config.js || { echo "::error::Capacitor configuration not found at repository root."; exit 1; }
          test -f www/index.html || { echo "::error::Expected webDir file www/index.html is missing."; exit 1; }
          node -e "const p=require('./package.json'); if(!p.dependencies?.['@capacitor/core'] && !p.devDependencies?.['@capacitor/cli']) { console.error('Capacitor dependencies are missing from package.json'); process.exit(1) }"
          echo "Build configuration detected."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project if absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            if [ -d android ]; then
              echo "::error::android/ exists but android/gradlew is missing. Remove or repair the incomplete Android project before building."
              exit 1
            fi
            npx cap add android
          fi
          test -f android/gradlew || { echo "::error::Capacitor did not generate android/gradlew."; exit 1; }

      - name: Sync hosted website configuration
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: andro-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
